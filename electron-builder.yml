appId: com.zhuruqi.app
productName: 入侵器
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Network
